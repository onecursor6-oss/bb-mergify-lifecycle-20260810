scopes:
  source:
    files:
      docs:
        include:
          - "docs/**"
      other:
        include:
          - "src/**"
  barrier_files:
    include:
      - "Makefile"
merge_queue:
  mode: parallel
  max_parallel_checks: 4
queue_rules:
  - name: default
    batch_size: 2
    merge_conditions:
      - check-success = BB_NEVER_PRESENT_BARRIER_GATE_20260810_R739
